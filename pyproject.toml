[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "translation-engine"
version = "0.1.0"
description = "Standalone offline translation worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  # Exact upstream source/wheel identity: packaging/argos-upstream.json.
  # Setup consumes only the reviewed hash through the local wheelhouse.
  "argostranslate==1.11.1",
  "ctranslate2==4.8.5",
  "sentencepiece==0.2.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
build = [
  "pyinstaller==6.22.3",
  "pip==25.3",
  "pip-tools==7.5.2",
  "setuptools==80.9.0",
  "wheel==0.45.1",
  "build==1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the explicitly provisioned real model",
  "packaging: requires the packaged Windows executable",
]
